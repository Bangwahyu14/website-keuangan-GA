<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Manajemen Keuangan</title>
    <!-- Import Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-title {
            font-weight: bold;
            color: #0056b3;
            text-align: center;
            margin-bottom: 30px;
        }
        .error-text {
            color: #dc3545; /* Merah */
            font-size: 0.875em;
            margin-top: 5px;
            display: none; /* Disembunyikan secara default */
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h3 class="login-title">Sistem Keuangan</h3>
        
        <form id="loginForm">
            <!-- Alert untuk error dari server (misal: password salah) -->
            <div id="serverAlert" class="alert alert-danger" style="display: none;" role="alert"></div>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="Masukkan username">
                <div id="usernameError" class="error-text">Username wajib diisi!</div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password">
                <div id="passwordError" class="error-text">Password wajib diisi!</div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100" id="loginButton">Masuk</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Mencegah halaman refresh saat tombol ditekan

            // Mengambil elemen input dan error
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            const serverAlert = document.getElementById('serverAlert');
            const loginButton = document.getElementById('loginButton');

            // Reset error text (menyembunyikan pesan error sebelumnya)
            usernameError.style.display = 'none';
            passwordError.style.display = 'none';
            serverAlert.style.display = 'none';

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // Validasi input kosong (Sesuai SRS REQ)
            let isValid = true;
            if (!username) {
                usernameError.style.display = 'block';
                isValid = false;
            }
            if (!password) {
                passwordError.style.display = 'block';
                isValid = false;
            }

            if (!isValid) return; // Hentikan proses jika ada form kosong

            // Ubah teks tombol saat memproses
            loginButton.innerText = "Memproses...";
            loginButton.disabled = true;

            try {
                // Menghubungi API Backend Node.js
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Jika sukses (Status 200)
                    // Simpan Token JWT dan Role ke Local Storage Browser
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('role', data.role);

                    // Arahkan (Redirect) ke halaman Rincian SPM
                    window.location.href = 'home.html';
                } else {
                    // Jika gagal (Password salah / user tidak ditemukan)
                    serverAlert.innerText = data.message;
                    serverAlert.style.display = 'block';
                }
            } catch (error) {
                console.error("Terjadi kesalahan koneksi:", error);
                serverAlert.innerText = "Gagal terhubung ke server. Pastikan backend aktif.";
                serverAlert.style.display = 'block';
            } finally {
                // Kembalikan tombol ke keadaan semula
                loginButton.innerText = "Masuk";
                loginButton.disabled = false;
            }
        });
    </script>
</body>
</html>
